spring.application.name=bug-tracker
server.port=${PORT:8080}

# ---- Database ----
# Default: file-based H2 (zero setup). For PostgreSQL / MySQL set the env vars below, e.g.
#   DB_URL=jdbc:postgresql://localhost:5432/bugtracker
#   DB_USERNAME=postgres  DB_PASSWORD=postgres
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/bugtracker}
spring.datasource.username=none
spring.datasource.password=none
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- JWT ----
app.jwt.secret=${JWT_SECRET:bug-tracker-default-secret-change-me-in-production-0123456789abcdef}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- CORS (comma separated list of allowed frontend origins) ----
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# ---- File upload ----
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---- Demo data (admin@bugtracker.com / Admin@123 ...) ----
app.seed-demo-data=${SEED_DEMO_DATA:true}

# ---- Swagger ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
