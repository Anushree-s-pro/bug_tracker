# docker compose up --build   ->  frontend http://localhost:3000 , API http://localhost:8080 , Swagger http://localhost:8080/swagger-ui.html
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bugtracker
      POSTGRES_USER: bugtracker
      POSTGRES_PASSWORD: bugtracker
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bugtracker"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://db:5432/bugtracker
      DB_USERNAME: bugtracker
      DB_PASSWORD: bugtracker
      JWT_SECRET: change-this-to-a-long-random-string-of-at-least-32-chars
      CORS_ORIGINS: http://localhost:3000
      UPLOAD_DIR: /data/uploads
    volumes: [uploads:/data/uploads]
    ports: ["8080:8080"]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080/api
    depends_on: [backend]
    ports: ["3000:80"]

volumes:
  pgdata:
  uploads:
